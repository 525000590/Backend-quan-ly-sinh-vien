$kind: http-request
url: "{{baseUrl}}/api/auth/me/avatar"
method: POST
headers:
  Authorization: Bearer {{studentToken}}
body:
  type: formdata
  content:
    - type: file
      key: avatar
      src:
        - fake-text-renamed.png
scripts:
  - type: afterResponse
    code: pm.test('U08 - Sai chữ ký file trả về 400 Bad Request', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 9000
