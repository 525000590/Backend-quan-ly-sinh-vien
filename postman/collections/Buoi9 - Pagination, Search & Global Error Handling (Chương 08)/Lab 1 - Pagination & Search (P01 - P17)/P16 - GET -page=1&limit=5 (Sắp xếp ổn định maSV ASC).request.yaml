$kind: http-request
name: P16 - GET ?page=1&limit=5 (Sắp xếp ổn định maSV ASC)
url: "{{baseUrl}}/api/v1/sinh-vien?page=1&limit=5"
method: GET
queryParams:
  page: "1"
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test('Dữ liệu được sắp xếp tăng dần theo maSV', function () {
        for (let i = 0; i < json.data.length - 1; i++) {
          pm.expect(json.data[i].maSV.localeCompare(json.data[i + 1].maSV)).to.be.at.most(0);
        }
      });
    language: text/javascript
order: 16000
