$kind: http-request
name: P09 - GET ?limit=abc (Lỗi limit chuỗi)
url: "{{baseUrl}}/api/v1/sinh-vien?limit=abc"
method: GET
queryParams:
  limit: abc
scripts:
  - type: afterResponse
    code: |-
      pm.test('Chặn limit=abc trả về 400 Bad Request', function () {
        pm.response.to.have.status(400);
        const json = pm.response.json();
        pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 9000
