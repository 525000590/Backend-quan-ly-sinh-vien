$kind: http-request
name: P08 - GET ?page=1.5 (Lỗi số thập phân)
url: "{{baseUrl}}/api/v1/sinh-vien?page=1.5"
method: GET
queryParams:
  page: "1.5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Chặn page=1.5 trả về 400 Bad Request', function () {
        pm.response.to.have.status(400);
        const json = pm.response.json();
        pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 8000
