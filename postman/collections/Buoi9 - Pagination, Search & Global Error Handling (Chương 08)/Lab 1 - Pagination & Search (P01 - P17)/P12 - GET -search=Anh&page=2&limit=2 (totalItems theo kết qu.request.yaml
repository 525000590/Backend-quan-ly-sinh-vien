$kind: http-request
name: P12 - GET ?search=Anh&page=2&limit=2 (totalItems theo kết quả lọc)
url: "{{baseUrl}}/api/v1/sinh-vien?search=Anh&page=2&limit=2"
method: GET
queryParams:
  search: Anh
  page: "2"
  limit: "2"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test('totalItems phản ánh số lượng khớp search', function () {
        pm.expect(json.pagination.totalItems).to.be.at.least(1);
      });
    language: text/javascript
order: 12000
