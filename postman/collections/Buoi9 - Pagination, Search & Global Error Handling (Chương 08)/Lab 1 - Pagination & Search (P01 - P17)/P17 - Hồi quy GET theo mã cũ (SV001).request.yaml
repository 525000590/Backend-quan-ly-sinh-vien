$kind: http-request
url: "{{baseUrl}}/api/v1/sinh-vien/SV001"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET /api/v1/sinh-vien/:maSV trả về 200 OK', function () {
        pm.response.to.have.status(200);
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
        pm.expect(json.data.maSV).to.eql('SV001');
      });
    language: text/javascript
order: 17000
