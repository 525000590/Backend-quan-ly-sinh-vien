$kind: http-request
name: P07 - GET ?page=0 (Lỗi page = 0)
url: "{{baseUrl}}/api/v1/sinh-vien?page=0"
method: GET
queryParams:
  page: "0"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Chặn page=0 trả về 400 Bad Request', function () {
        pm.response.to.have.status(400);
        const json = pm.response.json();
        pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 7000
