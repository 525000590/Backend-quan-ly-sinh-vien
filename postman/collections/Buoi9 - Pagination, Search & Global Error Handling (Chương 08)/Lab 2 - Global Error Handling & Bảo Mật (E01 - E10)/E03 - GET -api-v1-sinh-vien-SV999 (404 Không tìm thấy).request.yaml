$kind: http-request
name: E03 - GET /api/v1/sinh-vien/SV999 (404 Không tìm thấy)
url: "{{baseUrl}}/api/v1/sinh-vien/SV999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 404', function () { pm.response.to.have.status(404); });
      const json = pm.response.json();
      pm.test('Response 404 nhất quán', function () {
        pm.expect(json.success).to.be.false;
        pm.expect(json.status).to.eql(404);
        pm.expect(json.data).to.be.null;
      });
    language: text/javascript
order: 3000
