$kind: http-request
name: E09 - Student gửi DELETE /api/v1/sinh-vien/SV001 (Chặn 403)
url: "{{baseUrl}}/api/v1/sinh-vien/SV001"
method: DELETE
headers:
  Authorization: Bearer {{studentToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Chặn student xóa sinh viên 403 Forbidden', function () {
        pm.response.to.have.status(403);
        const json = pm.response.json();
        pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 9000
