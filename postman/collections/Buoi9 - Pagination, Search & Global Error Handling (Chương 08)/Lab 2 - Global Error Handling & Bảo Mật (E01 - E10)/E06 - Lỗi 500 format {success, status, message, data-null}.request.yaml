$kind: http-request
name: E06 - Lỗi 500 format {success, status, message, data:null}
url: "{{baseUrl}}/api/test-error-500"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cấu trúc lỗi 500 chuẩn hóa', function () {
        pm.response.to.have.status(500);
        const json = pm.response.json();
        pm.expect(json.success).to.be.false;
        pm.expect(json.status).to.eql(500);
        pm.expect(json.data).to.be.null;
      });
    language: text/javascript
order: 6000
