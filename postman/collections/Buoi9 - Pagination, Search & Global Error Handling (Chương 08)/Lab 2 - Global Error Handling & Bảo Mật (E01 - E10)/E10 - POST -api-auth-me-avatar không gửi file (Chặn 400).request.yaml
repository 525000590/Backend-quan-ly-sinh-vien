$kind: http-request
name: E10 - POST /api/auth/me/avatar không gửi file (Chặn 400)
url: "{{baseUrl}}/api/auth/me/avatar"
method: POST
headers:
  Authorization: Bearer {{studentToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Multer từ chối khi không có file 400 Bad Request', function () {
        pm.response.to.have.status(400);
        const json = pm.response.json();
        pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 10000
