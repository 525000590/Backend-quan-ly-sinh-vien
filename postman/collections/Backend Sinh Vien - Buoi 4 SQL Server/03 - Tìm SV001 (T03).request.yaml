$kind: http-request
url: "{{baseUrl}}/api/v1/sinh-vien/SV001"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status la 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tim dung SV001", function () {
          const body = pm.response.json();
          pm.expect(body.success).to.eql(true);
          pm.expect(body.data.maSV).to.eql("SV001");
          pm.expect(body.data.hoTen).to.eql("Minh Nhật");
          pm.expect(body.data.email).to.eql("minhnhat@example.com");
          pm.expect(body.data.maLop).to.eql("25CT114");
      });
    language: text/javascript
order: 3000
