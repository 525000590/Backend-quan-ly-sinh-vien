$kind: http-request
name: 10 - Họ tên quá dài > 150 ký tự
url: "{{baseUrl}}/api/v1/sinh-vien"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "maSV": "SV004",
      "hoTen": "Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A Nguyen Van A",
      "email": "test@example.com",
      "maLop": "25CT114"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status la 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Bao loi hoTen vuot qua 150 ky tu", function () {
          const body = pm.response.json();
          pm.expect(body.success).to.eql(false);
          pm.expect(body.message).to.include("150");
      });
    language: text/javascript
order: 10000
