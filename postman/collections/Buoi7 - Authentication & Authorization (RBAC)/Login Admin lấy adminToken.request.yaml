$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@example.com",
      "password": "Admin@123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Admin Login thành công', function () { pm.response.to.have.status(200); });
      const b = pm.response.json();
      pm.collectionVariables.set('adminToken', b.data.accessToken);
    language: text/javascript
order: 11000
