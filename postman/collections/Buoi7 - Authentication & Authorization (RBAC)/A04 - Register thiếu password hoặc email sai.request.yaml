$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Thiếu Mật Khẩu",
      "email": "khong-phai-email"
    }
scripts:
  - type: afterResponse
    code: pm.test('A04 - Status là 400 Bad Request', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
