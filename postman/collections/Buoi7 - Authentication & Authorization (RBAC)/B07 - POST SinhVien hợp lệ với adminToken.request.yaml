$kind: http-request
url: "{{baseUrl}}/api/v1/sinh-vien"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "maSV": "{{testMaSV}}",
      "hoTen": "Nguyễn Văn Admin Test",
      "email": "admintest@example.com",
      "maLop": "25CT114"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('B07 - Status là 201 Created', function () { pm.response.to.have.status(201); });
      const b = pm.response.json();
      pm.test('B07 - Đúng maSV', function () { pm.expect(b.data.maSV).to.eql('SV098'); });
    language: text/javascript
order: 18000
