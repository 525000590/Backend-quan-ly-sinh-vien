$kind: http-request
url: "{{baseUrl}}/api/v1/sinh-vien"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "maSV": "SV004",
      "email": "thunghiem@example.com",
      "maLop": "25CT114"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("T04 - Status là 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      pm.test("T04 - Báo lỗi thiếu trường dữ liệu", function () {
          const body = pm.response.json();
          pm.expect(body.success).to.eql(false);
      });
    language: text/javascript
order: 4000
