openapi: 3.0.3
info:
  title: API Quản lý sinh viên
  version: 1.0.0
  description: RESTful CRUD SinhVien & Authentication - thực hành Buổi 07 (JWT & Phân quyền).
servers:
  - url: /
    description: Cùng host và port với Express
tags:
  - name: Auth
    description: Xác thực & Quản lý tài khoản người dùng
  - name: SinhVien
    description: Quản lý sinh viên
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản người dùng mới
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập nhận JWT Access Token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/profile:
    get:
      tags: [Auth]
      summary: Xem thông tin hồ sơ cá nhân
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lấy thông tin hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me/avatar:
    post:
      tags: [Auth]
      summary: Tải lên và cập nhật ảnh đại diện cá nhân
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: File ảnh định dạng JPEG hoặc PNG (tối đa 2MB)
      responses:
        '200':
          description: Cập nhật ảnh đại diện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sinh-vien:
    get:
      tags: [SinhVien]
      summary: Lấy danh sách sinh viên (Public)
      operationId: getDanhSachSinhVien
      responses:
        '200':
          description: Thành công, có thể trả danh sách rỗng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinhVienListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [SinhVien]
      summary: Thêm sinh viên mới (Yêu cầu Admin)
      operationId: taoSinhVien
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinhVien'
      responses:
        '201':
          description: Tạo sinh viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinhVienResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sinh-vien/{maSV}:
    parameters:
      - $ref: '#/components/parameters/MaSV'
    get:
      tags: [SinhVien]
      summary: Lấy sinh viên theo mã (Public)
      operationId: getSinhVienTheoMa
      responses:
        '200':
          description: Tìm thấy sinh viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinhVienResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [SinhVien]
      summary: Cập nhật thông tin sinh viên (Yêu cầu Admin)
      operationId: capNhatSinhVien
      description: Gửi đủ hoTen, email, maLop; maSV lấy từ URL.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinhVienUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinhVienResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [SinhVien]
      summary: Xóa sinh viên theo mã (Yêu cầu Admin)
      operationId: xoaSinhVien
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MaSV:
      name: maSV
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        example: SV003
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, password]
      properties:
        fullName: { type: string, example: Nguyen Minh An }
        email: { type: string, format: email, example: an.lab@example.com }
        password: { type: string, format: password, example: SinhVien@123 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, example: an.lab@example.com }
        password: { type: string, format: password, example: SinhVien@123 }
    User:
      type: object
      required: [id, fullName, email, role]
      properties:
        id: { type: integer, example: 1 }
        fullName: { type: string, example: Nguyen Minh An }
        email: { type: string, format: email, example: an.lab@example.com }
        role: { type: string, example: student }
        avatarUrl: { type: string, nullable: true, example: '/uploads/abc-123.png' }
    AvatarResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true], example: true }
        message: { type: string, example: Cập nhật ảnh đại diện thành công }
        data:
          type: object
          required: [avatarUrl]
          properties:
            avatarUrl: { type: string, example: '/uploads/abc-123.png' }
    UserResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true], example: true }
        message: { type: string, example: Thao tác thành công }
        data:
          $ref: '#/components/schemas/User'
    LoginResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true], example: true }
        message: { type: string, example: Login success }
        data:
          type: object
          required: [accessToken, tokenType, expiresIn]
          properties:
            accessToken: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
            tokenType: { type: string, example: Bearer }
            expiresIn: { type: integer, example: 3600 }
    ValidationIssue:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: email }
        message: { type: string, example: Email không hợp lệ }
    SinhVien:
      type: object
      additionalProperties: false
      required: [maSV, hoTen, email, maLop]
      properties:
        maSV: {type: string, minLength: 1, example: SV003}
        hoTen: {type: string, minLength: 1, example: Ngọc Mai}
        email: {type: string, format: email, example: ngocmai@example.com}
        maLop: {type: string, minLength: 1, example: 25CT114}
    SinhVienUpdate:
      type: object
      additionalProperties: false
      required: [hoTen, email, maLop]
      properties:
        hoTen: {type: string, minLength: 1, example: Ngọc Mai Updated}
        email: {type: string, format: email, example: ngocmai@example.com}
        maLop: {type: string, minLength: 1, example: 25CT114}
    SinhVienResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, enum: [true], example: true}
        message: {type: string, example: Thao tác thành công}
        data:
          $ref: '#/components/schemas/SinhVien'
    SinhVienListResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, enum: [true], example: true}
        message: {type: string, example: Lấy danh sách thành công}
        data:
          type: array
          items:
            $ref: '#/components/schemas/SinhVien'
    DeleteResponse:
      type: object
      required: [success, message]
      properties:
        success: {type: boolean, enum: [true], example: true}
        message: {type: string, example: Xóa sinh viên thành công}
    ErrorResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, enum: [false], example: false}
        message: {type: string, example: Yêu cầu không thực hiện được}
        data: {type: object, nullable: true, example: null}
        errors:
          type: array
          description: Chi tiết lỗi Validation (nếu có)
          items:
            $ref: '#/components/schemas/ValidationIssue'
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Quyền truy cập bị từ chối - Yêu cầu vai trò Admin
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Dung lượng file vượt quá giới hạn cho phép (2MB)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Dữ liệu đã tồn tại (xung đột)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Lỗi ngoài dự kiến trên server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
