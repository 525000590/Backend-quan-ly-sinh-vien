services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-quan-ly-sinh-vien
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-YourStrong@Password123}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-quan-ly-sinh-vien
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-QuanLySinhVienDB}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-YourStrong@Password123}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_123456}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads-data:/app/public/uploads
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
    name: sqlserver-data
  uploads-data:
    name: uploads-data
